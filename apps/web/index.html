<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f3f2f2" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1b1a1a" media="(prefers-color-scheme: dark)" />
<!-- iOS treats these separately from the web manifest: without them, "Add to
     Home Screen" opens in a Safari chrome instead of standalone, and the
     status bar sits on an opaque bar rather than over the app. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="AfterCare" />
<title>AfterCare — Understand Your Own Discharge Paperwork</title>
<meta name="description" content="AfterCare turns your own discharge paperwork into a plain-language, read-aloud recovery guide. Informational only — always follow your care team's instructions." />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
</head>
<body>
<div id="root"></div>
<!-- Google Translate mounts here. Its own dropdown and banner are hidden in CSS:
     the app ships its own picker, which applies a language by cookie + reload so
     the widget never rewrites text nodes underneath a live React tree — doing
     that throws NotFoundError from removeChild on the next render. -->
<div id="google_translate_element" aria-hidden="true"></div>
<script>
  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      { pageLanguage: "en", autoDisplay: false },
      "google_translate_element"
    );
  }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
